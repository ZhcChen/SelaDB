<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SelaDB UI 设计源:跨平台数据库管理工具的 HTML + CSS + JS 视觉与交互基线。"
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./assets/tokens.css" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <link rel="stylesheet" href="./assets/pages.css" />
    <title>SelaDB Design Source</title>
  </head>
  <body data-theme="light" data-density="comfortable">
    <div id="app" class="app-root">
      <noscript>该设计源需要启用 JavaScript 才能运行。</noscript>
    </div>

    <!--
      纯静态:没有构建步骤,没有依赖,双击 index.html 就能打开。
      所以不能用 ES module —— 浏览器在 file:// 协议下会用 CORS 规则拦住
      模块脚本去加载外部 .js,表现是整页空白。普通 <script> 没有这个限制。

      加载顺序按依赖排:
        icons        ← 基础图标
        ui-kit       ← 弹层/抽屉/Toast/表单控件,依赖 icons
        menu         ← 菜单
        tree         ← 依赖 icons
        datagrid     ← 依赖 menu、ui-kit
        document-tree← 依赖 icons、ui-kit
        query-editor ← 词法着色
        structure-view← 依赖 icons、query-editor
        command-palette← 依赖 icons
        value-editor ← 依赖 icons
        mock-data    ← 假数据
        mock-sql     ← 假执行器
        app          ← 装配,依赖上面全部
        main         ← 启动
    -->
    <script src="./assets/icons.js"></script>
    <script src="./assets/ui-kit.js"></script>
    <script src="./assets/menu.js"></script>
    <script src="./assets/tree.js"></script>
    <script src="./assets/datagrid.js"></script>
    <script src="./assets/document-tree.js"></script>
    <script src="./assets/query-editor.js"></script>
    <script src="./assets/structure-view.js"></script>
    <script src="./assets/command-palette.js"></script>
    <script src="./assets/value-editor.js"></script>
    <script src="./assets/mock-data.js"></script>
    <script src="./assets/mock-sql.js"></script>
    <script src="./assets/app.js"></script>
    <script src="./assets/main.js"></script>
  </body>
</html>
